name: Deploy Test

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  build:
    name: Build Test release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish API
        run: >
          dotnet publish
          ./Project.API/Project.API.csproj
          --configuration Release
          --no-build
          --output ./artifacts/release/app

      - name: Install EF Core CLI tools
        run: dotnet tool install --global dotnet-ef --version 7.0.9

      - name: Create migration bundle
        run: >
          dotnet ef migrations bundle
          --project ./Project.Infrastructure/Project.Infrastructure.csproj
          --startup-project ./Project.API/Project.API.csproj
          --context ApplicationDbContext
          --configuration Release
          --output ./artifacts/release/database/efBundle.exe
          --force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-api-test-release
          path: ./artifacts/release
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Test
    needs: build

    runs-on:
      - self-hosted
      - Windows
      - X64
      - web-api-deploy

    environment:
      name: Test

    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    env:
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      ASPNETCORE_ENVIRONMENT: ${{ vars.ASPNETCORE_ENVIRONMENT }}
      ASPNETCORE_URLS: ${{ vars.ASPNETCORE_URLS }}

      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
      DB_CHECK_URL: ${{ vars.DB_CHECK_URL }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-api-test-release
          path: $({ runner.temp })\web-api-test-release

      - name: Validate deployment configuration
        run: |
          $requiredValues = @{
              DEPLOY_PATH             = $env:DEPLOY_PATH
              SERVICE_NAME            = $env:SERVICE_NAME
              HEALTH_URL              = $env:HEALTH_URL
              DB_CHECK_URL            = $env:DB_CHECK_URL
              DB_CONNECTION_STRING    = $env:DB_CONNECTION_STRING
              JWT_SECRET              = $env:JWT_SECRET
          }
              
          foreach ($item in $requiredValues.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace($item.Value)) {
                  throw "Required deployment environment variable '$($item.Key)' is not set or is empty."
              }
          }

          if (-not (Get-Service $env:SERVICE_NAME -ErrorAction SilentlyContinue)) {
              throw "Windows Service '$($env:SERVICE_NAME)' does not exist on this machine."
          }

      - name: Stop Test service
        run: |
          $service = Get-Service $env:SERVICE_NAME

          if ($service.Status -ne 'Stopped') {
              Stop-Service $env:SERVICE_NAME -Force
              $service.WaitForStatus(
                  [System.ServiceProcess.ServiceControllerStatus]::Stopped,
                  [TimeSpan]::FromSeconds(30)
              )
          }

          Write-Host "$env:SERVICE_NAME service stopped successfully."

      - name: Back up current deployment
        run: |
          if (Test-Path -LiteralPath $env:DEPLOY_PATH) {
            $backupRoot = "C:\Apps\WebApi\Backups\Test"
            $backupName = Get-Date -Format "yyyyMMdd-HHmmss"
            $backupPath = Join-Path $backupRoot $backupName

            New-Item `
              -ItemType Directory `
              -Path $backupPath `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$env:DEPLOY_PATH\*" `
              -Destination $backupPath `
              -Recurse `
              -Force

            Write-Host "Previous deployment backed up to: $backupPath"
          }

      - name: Replace deployed application
        run: |
          $sourcePath = Join-Path $env:RUNNER_TEMP `
              "web-api-test-release\app"

          if (-not (Test-Path -LiteralPath $sourcePath)) {
              throw "Published application was not downloaded: $sourcePath"
          }

          New-Item `
              -ItemType Directory `
              -Path $env:DEPLOY_PATH `
              -Force |
              Out-Null

          Get-ChildItem `
              -LiteralPath $env:DEPLOY_PATH `
              -Force |
              Remove-Item -Recurse -Force

          Copy-Item `
              -Path "$sourcePath\*" `
              -Destination $env:DEPLOY_PATH `
              -Recurse `
              -Force

          Write-Host "Deployment directory updated with new release. Application files deployed to $env:DEPLOY_PATH"

      - name: Configure Test application
        run: |
          $configPath = Join-Path $env:DEPLOY_PATH "appsettings.Test.json"

          if (-not (Test-Path -LiteralPath $configPath)) {
              throw "Test configuration file was not deployed. Expected at: $configPath"
          }

          $config = Get-Content - LiteralPath $configPath -Raw | ConvertFrom-Json

          if ($null -eq $config.ConnectionStrings) {
              $config | Add-Member -NotePropertyName ConnectionStrings -NotePropertyValue ([PSCustomObject]@{})
          }

          $config.ConnectionStrings | Add-Member -NotePropertyName PrimaryDbConnection `
              -NotePropertyValue $env:DB_CONNECTION_STRING `
              -Force

          if ($null -eq $config.AppSettings) {
              $config | Add-Member `
                  -NotePropertyName AppSettings `
                  -NotePropertyValue ([PSCustomObject]@{})
          }

          if ($null -eq $config.AppSettings.JwtConfig) {
              $config.AppSettings | Add-Member `
                -NotePropertyName JwtConfig `
                -NotePropertyValue ([PSCustomObject]@{})
          }

          $config.AppSettings.JwtConfig |
              Add-Member `
                  -NotePropertyName Secret `
                  -NotePropertyValue $env:JWT_SECRET `
                  -Force

          $config |
              ConvertTo-Json -Depth 20 |
              Set-Content `
                  -LiteralPath $configPath `
                  -Encoding UTF8

          Write-Host "Test configuration generated successfully."

      - name: Apply database migrations
        run: |
          $migrationBundle =
              Join-Path $env:RUNNER_TEMP `
                  "web-api-test-release\database\efbundle.exe"

          if (-not (Test-Path -LiteralPath $migrationBundle)) {
              throw "Migration bundle was not downloaded."
          }

          & $migrationBundle `
              --connection $env:DB_CONNECTION_STRING

          if ($LASTEXITCODE -ne 0) {
              throw "Database migration failed with exit code $LASTEXITCODE."
          }

          Write-Host "Database migrations applied successfully."

      - name: Start Test service
        run: |
          Start-Service $env:SERVICE_NAME

          $service = Get-Service $env:SERVICE_NAME

          $service.WaitForStatus(
              [System.ServiceProcess.ServiceControllerStatus]::Running,
              [TimeSpan]::FromSeconds(30)
          )

          Write-Host "$env:SERVICE_NAME is running."

      - name: Validate health endpoint
        run: |
          $maximumAttempts = 12
          $delaySeconds = 5

          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
              try {
                  $response = Invoke-WebRequest `
                      -Uri $env:HEALTH_URL `
                      -UseBasicParsing `
                      -TimeoutSec 10

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Health check passed."
                      exit 0
                  }
              }
              catch {
                  Write-Host `
                      "Health attempt $attempt failed: $($_.Exception.Message)"
              }

              Start-Sleep -Seconds $delaySeconds
          }

          throw "Health endpoint did not return HTTP 200."

      - name: Validate database-backed endpoint
        run: |
          $response = Invoke-WebRequest `
              -Uri $env:DB_CHECK_URL `
              -UseBasicParsing `
              -TimeoutSec 30

          if ($response.StatusCode -ne 200) {
              throw `
                  "Database-backed endpoint returned HTTP $($response.StatusCode)."
          }

          Write-Host "Database-backed endpoint passed."
